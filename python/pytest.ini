[pytest]
# Run from the python/ directory: `pytest`
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: pure functions, no file IO
    io: file parsing / writing via small fixtures
    stat: numerical correctness of statistical cores
    regression: golden-file end-to-end (may be skipped until baselines exist)
    deep: requires external binaries (e.g. samtools)

addopts = -q --strict-markers --import-mode=importlib

filterwarnings =
    ignore::DeprecationWarning
